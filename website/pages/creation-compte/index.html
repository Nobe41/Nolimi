<!DOCTYPE html>
<!-- website/pages/creation-compte/ — après paiement Stripe : saisie des emails → création des comptes. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="../connexion/connexion.css">
    <link rel="stylesheet" href="./creation-compte.css">
    <script src="./creation-compte-api.js"></script>
</head>
<body class="page page--auth">
    <script src="../../components/navbar/navbar.js"></script>
    <script>NolimiNavbar.mount();</script>

    <main class="page-main page-main--auth">
        <div class="auth-centre">
            <!-- Confirmation paiement -->
            <div class="payment-success" aria-labelledby="payment-success-title">
                <div class="payment-success__icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="3"/>
                        <path d="M20 33.5L28.5 42L44 24.5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <p class="payment-success__text" id="payment-success-title">Paiement validé</p>
            </div>

            <form class="form-login form-licenses" id="form-licenses">
                <div class="admin-field" id="admin-field">
                    <label class="license-field__label" for="admin-email">Compte admin</label>
                    <div class="admin-field__box" id="admin-email" role="text">Chargement…</div>
                </div>

                <div id="license-fields"></div>
                <div id="error-msg" class="error-msg" aria-live="polite"></div>
                <div id="success-msg" class="success-msg" aria-live="polite"></div>

                <p class="login-legal" id="login-legal">
                    En cliquant sur « Valider », vous acceptez nos
                    <a href="../mentions-legales/index.html#cgv">CGV</a>,
                    nos <a href="../mentions-legales/index.html#cgu">CGU</a>
                    et notre <a href="../mentions-legales/index.html#confidentialite">Politique de confidentialité</a>.
                    Vous recevrez vos identifiants par mail.
                </p>

                <button type="submit" id="btn-submit" disabled>Valider</button>
                <a href="../connexion/index.html" class="license-login-btn" id="btn-login" hidden>Se connecter</a>
            </form>
        </div>
    </main>

    <script src="./creation-compte.js"></script>
</body>
</html>
