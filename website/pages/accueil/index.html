<!DOCTYPE html>
<!-- website/pages/accueil/ — page d’accueil du site. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="./accueil.css">
</head>
<body class="page page--home">
    <script src="../../components/navbar/navbar.js"></script>
    <script>NolimiNavbar.mount();</script>

    <main class="page-main page-main--home" id="accueil">
        <section class="home-hero" aria-labelledby="home-title">
            <div class="home-hero__layout">
                <!-- Texte + CTA -->
                <div class="home-hero__copy">
                    <h1 id="home-title">Concevez vos bouteilles en quelques clics</h1>
                    <p class="home-lead">Grâce à une conception paramétrique, créez vos bouteilles en quelques minutes.</p>
                    <a href="../connexion/index.html" class="home-cta">Se connecter</a>
                </div>
                <!-- Image hero -->
                <figure class="home-preview">
                    <img
                        src="../../assets/nolimi-bottles-hero.png"
                        alt="Rendu 3D de bouteilles conçues avec Nolimi"
                        class="home-preview__img"
                        width="1024"
                        height="929"
                        decoding="async"
                    >
                </figure>
            </div>
        </section>
    </main>

    <script src="../../components/footer/footer.js"></script>
    <script>NolimiFooter.mount();</script>
</body>
</html>
