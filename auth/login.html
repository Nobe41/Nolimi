<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi - Connexion</title>
    <link rel="stylesheet" href="../assets/brand/tokens.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }
        .centre {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .form-login {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 320px;
        }
        .form-login label {
            font-size: 0.9rem;
            color: var(--nolimi-text);
        }
        .form-login input {
            padding: 0.6rem 0.75rem;
            font-size: 1rem;
            border: 1px solid var(--nolimi-border);
            border-radius: 6px;
        }
        .form-login input:focus {
            outline: none;
            border-color: var(--nolimi-accent);
        }
        .form-login button {
            margin-top: -0.8rem;
            padding: 0.65rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            background: var(--nolimi-accent);
            color: #fff;
            border: none;
            border-radius: 6px;
        }
        .form-login button:hover { background: var(--nolimi-accent-hover); }
        .form-login button:disabled { opacity: 0.6; cursor: wait; }
        .error-msg {
            color: var(--nolimi-danger);
            font-size: 0.9rem;
            margin: 0;
            min-height: 0;
        }
        .error-msg:not(:empty) {
            min-height: 1.4em;
            margin-bottom: 0.25rem;
        }
        .btn-retour {
            position: absolute;
            top: 1rem;
            left: 1.5rem;
            padding: 0.5rem 1rem;
            font-size: 0.95rem;
            color: var(--nolimi-text);
            text-decoration: none;
            border: 1px solid var(--nolimi-border);
            border-radius: 6px;
            background: var(--nolimi-surface);
        }
        .btn-retour:hover { background: var(--nolimi-bg); }
        .login-legal {
            margin: -0.35rem 0 0.5rem;
            font-size: 0.72rem;
            line-height: 1.5;
            color: var(--nolimi-text-muted);
            text-align: center;
        }
        .login-legal a {
            color: var(--nolimi-accent);
            text-decoration: none;
        }
        .login-legal a:hover {
            text-decoration: underline;
        }
        .login-session-bar {
            position: fixed;
            bottom: 1.25rem;
            left: 1.5rem;
            right: 1.5rem;
            display: flex;
            justify-content: center;
        }
        .login-session-row {
            display: flex;
            gap: 0.5rem;
            width: 100%;
            max-width: 320px;
        }
        .login-session-row input {
            flex: 1;
            min-width: 0;
            padding: 0.6rem 0.75rem;
            font-size: 0.85rem;
            border: 1px solid var(--nolimi-border);
            border-radius: 6px;
            background: transparent;
        }
        .login-session-row input:focus {
            outline: none;
            border-color: var(--nolimi-accent);
        }
        .login-session-row button {
            flex-shrink: 0;
            padding: 0.6rem 0.85rem;
            font-size: 0.85rem;
            cursor: pointer;
            background: var(--nolimi-accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            white-space: nowrap;
        }
        .login-session-row button:hover { background: var(--nolimi-accent-hover); }
        .login-session-row button:disabled { opacity: 0.6; cursor: wait; }
        .login-session-row button.invalid {
            background: var(--nolimi-danger) !important;
        }
        .login-session-row button.invalid:hover {
            background: var(--nolimi-danger) !important;
        }
        .centre {
            padding-bottom: 4rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../saas/config/supabase.config.js"></script>
    <script src="../saas/lib/auth.js"></script>
</head>
<body>
    <a href="../website/index.html" class="btn-retour">← Retour</a>
    <main class="centre">
        <form class="form-login" id="form-login">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="votre@email.com" required autocomplete="email">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            <p class="login-legal">
                En vous connectant, vous acceptez nos
                <a href="../website/mentions-legales.html">Mentions Légales &amp; CGU</a>.
            </p>
            <div id="error-msg" class="error-msg" aria-live="polite"></div>
            <button type="submit" id="btn-submit">Connexion</button>
        </form>
    </main>
    <div class="login-session-bar">
        <div class="login-session-row">
            <input type="text" id="login-session-link" placeholder="Collez le lien de session ici" autocomplete="off">
            <button type="button" id="btn-session-join">Rejoindre</button>
        </div>
    </div>
    <script>
        (function () {
            var form = document.getElementById('form-login');
            var errEl = document.getElementById('error-msg');
            var submitBtn = document.getElementById('btn-submit');
            var sessionInput = document.getElementById('login-session-link');
            var btnSessionJoin = document.getElementById('btn-session-join');
            var invalidBtnTimer = null;
            var autoJoinTimer = null;
            var joinInProgress = false;

            if (typeof NolimiAuth !== 'undefined' && NolimiAuth.consumeGuestExitMessage) {
                var guestExitMsg = NolimiAuth.consumeGuestExitMessage();
                if (guestExitMsg) errEl.textContent = guestExitMsg;
            }

            function parseSessionId(input) {
                if (typeof NolimiAuth === 'undefined' || !NolimiAuth.parseSessionLink) return '';
                return NolimiAuth.parseSessionLink(input);
            }

            function isValidSessionLink(input) {
                var sessionId = parseSessionId(input);
                return typeof NolimiAuth !== 'undefined'
                    && NolimiAuth.isValidSessionId
                    && NolimiAuth.isValidSessionId(sessionId);
            }

            function persistSession(sessionId) {
                if (typeof NolimiAuth !== 'undefined' && NolimiAuth.persistPendingSession) {
                    NolimiAuth.persistPendingSession(sessionId);
                }
            }

            function resetJoinBtn() {
                if (!btnSessionJoin) return;
                btnSessionJoin.disabled = false;
                btnSessionJoin.textContent = 'Rejoindre';
            }

            function setJoinBtnLoading(loading) {
                if (!btnSessionJoin) return;
                btnSessionJoin.disabled = !!loading;
                btnSessionJoin.textContent = loading ? '...' : 'Rejoindre';
            }

            function goToSession(sessionId) {
                if (typeof NolimiAuth !== 'undefined' && NolimiAuth.clearPendingSession) {
                    NolimiAuth.clearPendingSession();
                }
                window.location.replace(NolimiAuth.getAppUrl(sessionId));
            }

            function showInvalidSessionBtn() {
                if (!btnSessionJoin) return;
                if (invalidBtnTimer) clearTimeout(invalidBtnTimer);
                btnSessionJoin.classList.add('invalid');
                invalidBtnTimer = setTimeout(function () {
                    btnSessionJoin.classList.remove('invalid');
                    invalidBtnTimer = null;
                }, 2000);
            }

            function tryJoinSession() {
                if (joinInProgress) return;
                if (!sessionInput || !isValidSessionLink(sessionInput.value)) {
                    showInvalidSessionBtn();
                    return;
                }

                joinInProgress = true;
                var sessionId = parseSessionId(sessionInput.value);
                persistSession(sessionId);
                errEl.textContent = '';

                if (typeof NolimiAuth === 'undefined' || !NolimiAuth.getClient) {
                    errEl.textContent = 'Service de connexion indisponible.';
                    joinInProgress = false;
                    return;
                }

                var sb = NolimiAuth.getClient();
                if (!sb) {
                    errEl.textContent = 'Configuration Supabase manquante.';
                    joinInProgress = false;
                    return;
                }

                setJoinBtnLoading(true);
                errEl.textContent = 'Ouverture de la session…';

                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;

                NolimiAuth.ensureAuthForSessionJoin(email, password).then(function (authResult) {
                    if (authResult.error) {
                        var guestMsg = typeof NolimiAuth.mapGuestAuthError === 'function'
                            ? NolimiAuth.mapGuestAuthError(authResult.error)
                            : (authResult.error.message || 'Impossible de rejoindre la session.');
                        errEl.textContent = guestMsg;
                        setJoinBtnLoading(false);
                        joinInProgress = false;
                        return;
                    }
                    goToSession(sessionId);
                }).catch(function () {
                    errEl.textContent = 'Erreur réseau. Réessayez.';
                    setJoinBtnLoading(false);
                    joinInProgress = false;
                });
            }

            function scheduleAutoJoin() {
                if (autoJoinTimer) clearTimeout(autoJoinTimer);
                autoJoinTimer = setTimeout(function () {
                    if (!sessionInput || !isValidSessionLink(sessionInput.value)) return;
                    tryJoinSession();
                }, 400);
            }

            function autoJoinFromValidLink() {
                if (!sessionInput || !isValidSessionLink(sessionInput.value)) return;
                tryJoinSession();
            }

            function getSessionForRedirect() {
                var fromUrl = new URLSearchParams(window.location.search).get('session');
                if (fromUrl && isValidSessionLink(fromUrl)) return parseSessionId(fromUrl);
                if (typeof NolimiAuth !== 'undefined' && NolimiAuth.getPendingSession) {
                    var pending = NolimiAuth.getPendingSession();
                    if (pending) return pending;
                }
                if (sessionInput && isValidSessionLink(sessionInput.value)) {
                    return parseSessionId(sessionInput.value);
                }
                return '';
            }

            if (sessionInput) {
                var sessionFromUrl = new URLSearchParams(window.location.search).get('session');
                if (sessionFromUrl) {
                    sessionInput.value = sessionFromUrl;
                    persistSession(sessionFromUrl);
                }
                sessionInput.addEventListener('input', function () {
                    var sessionId = parseSessionId(sessionInput.value);
                    if (isValidSessionLink(sessionInput.value)) {
                        persistSession(sessionId);
                        scheduleAutoJoin();
                    }
                });
                sessionInput.addEventListener('paste', function () {
                    setTimeout(scheduleAutoJoin, 50);
                });
            }

            if (typeof NolimiAuth !== 'undefined' && NolimiAuth.redirectIfAlreadyLoggedIn) {
                NolimiAuth.redirectIfAlreadyLoggedIn(getSessionForRedirect()).then(function () {
                    autoJoinFromValidLink();
                });
            } else {
                autoJoinFromValidLink();
            }

            if (btnSessionJoin) {
                btnSessionJoin.addEventListener('click', tryJoinSession);
            }
            if (sessionInput) {
                sessionInput.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        tryJoinSession();
                    }
                });
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                var email = document.getElementById('email').value.trim();
                var password = document.getElementById('password').value;
                errEl.textContent = '';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Connexion...';

                if (typeof NolimiAuth === 'undefined' || !NolimiAuth.signInWithPassword) {
                    errEl.textContent = 'Service de connexion indisponible.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Connexion';
                    return;
                }

                NolimiAuth.signInWithPassword(email, password).then(function (result) {
                    if (result.error) {
                        errEl.textContent = result.error.message;
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Connexion';
                        return;
                    }
                    var sessionId = '';
                    if (sessionInput && isValidSessionLink(sessionInput.value)) {
                        sessionId = parseSessionId(sessionInput.value);
                    }
                    if (sessionId) {
                        goToSession(sessionId);
                        return;
                    }
                    if (typeof NolimiAuth.clearPendingSession === 'function') {
                        NolimiAuth.clearPendingSession();
                    }
                    window.location.replace(NolimiAuth.getAppUrl());
                }).catch(function () {
                    errEl.textContent = 'Erreur réseau. Réessayez.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Connexion';
                });
            });
        })();
    </script>
</body>
</html>
