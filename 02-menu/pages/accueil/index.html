<!DOCTYPE html>
<!-- 02-menu/pages/accueil/ — accueil après connexion + projets récents. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi — Accueil</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="./accueil.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../01-saas/config/supabase.config.js"></script>
    <script src="../../../01-saas/lib/auth.js"></script>
    <script src="../../../01-saas/store/cloud-projects.js"></script>
</head>
<body class="page page--menu">
    <script src="../../components/sidebar/sidebar.js"></script>
    <script>NolimiMenuSidebar.mount({ current: 'accueil' });</script>

    <main class="menu-main menu-main--accueil">
        <header class="accueil-header">
            <div class="accueil-header__text">
                <h1 class="accueil-title" id="accueil-greeting">Bonjour</h1>
                <p class="accueil-lead">Ne perdez pas de temps : concevez vos bouteilles super rapidement.</p>
            </div>
            <button type="button" class="accueil-btn-nouveau" id="btn-nouveau">
                <svg class="accueil-btn-nouveau__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Nouveau projet
            </button>
        </header>

        <section class="accueil-recent">
            <h2 class="accueil-recent__title">Projets récents</h2>
            <p class="accueil-recent__status" id="accueil-recent-status" aria-live="polite">Chargement…</p>
            <ul class="accueil-recent__list" id="accueil-recent-list" hidden></ul>
        </section>
    </main>

    <script src="./accueil.js"></script>
</body>
</html>
