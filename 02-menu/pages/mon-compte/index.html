<!DOCTYPE html>
<!-- 02-menu/pages/mon-compte/ — mon compte (profil + déconnexion). -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi — Mon compte</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="./mon-compte.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../01-saas/config/supabase.config.js"></script>
    <script src="../../../01-saas/lib/auth.js"></script>
</head>
<body class="page page--menu">
    <script src="../../components/sidebar/sidebar.js"></script>
    <script>NolimiMenuSidebar.mount({ current: 'mon-compte' });</script>

    <main class="menu-main menu-main--mon-compte">
        <h1 class="compte-title">Mon compte</h1>

        <section class="compte-card">
            <header class="compte-card__header">
                <div class="compte-card__avatar" id="compte-avatar" aria-hidden="true">—</div>
                <div class="compte-card__identity">
                    <div class="compte-card__email" id="compte-email-display">—</div>
                    <div class="compte-card__role" id="compte-role">—</div>
                </div>
            </header>

            <div class="compte-card__details">
                <div class="compte-row">
                    <span class="compte-row__label">Adresse email</span>
                    <span class="compte-row__value" id="compte-email">—</span>
                </div>
                <div class="compte-row">
                    <span class="compte-row__label">Administrateur</span>
                    <span class="compte-row__value" id="compte-manager">—</span>
                </div>
            </div>
        </section>

        <div class="compte-actions">
            <button type="button" class="compte-btn compte-btn--secondary" id="btn-back-website">
                <svg class="compte-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.6 3.6 5.4 3.6 8.5S14.4 17.9 12 20.5C9.6 17.9 8.4 15.1 8.4 12S9.6 6.1 12 3.5Z"/></svg>
                Retour au site web
            </button>
            <button type="button" class="compte-btn compte-btn--danger" id="btn-logout">
                <svg class="compte-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4.5H6.5A2 2 0 0 0 4.5 6.5v11A2 2 0 0 0 6.5 19.5H10"/><path d="M14 8.5 18.5 12 14 15.5"/><path d="M18.5 12H9"/></svg>
                Se déconnecter
            </button>
        </div>
    </main>

    <script src="./mon-compte.js"></script>
</body>
</html>
