<!DOCTYPE html>
<!-- 02-menu/pages/equipe/ — membres de l’équipe (cartes). -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi — Équipe</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="./equipe.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../01-saas/config/supabase.config.js"></script>
    <script src="../../../01-saas/lib/auth.js"></script>
</head>
<body class="page page--menu">
    <script src="../../components/sidebar/sidebar.js"></script>
    <script>NolimiMenuSidebar.mount({ current: 'equipe' });</script>

    <main class="menu-main menu-main--equipe">
        <div class="equipe-toolbar">
            <div class="equipe-filters" role="tablist" aria-label="Filtres">
                <button type="button" class="equipe-filter is-active" data-filter="all" id="filter-all">Tous (0)</button>
                <button type="button" class="equipe-filter" data-filter="admin" id="filter-admin">Admin (0)</button>
                <button type="button" class="equipe-filter" data-filter="collab" id="filter-collab">Collaborateur (0)</button>
            </div>
            <label class="equipe-search">
                <svg class="equipe-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16.5 16.5 4 4"/></svg>
                <input type="search" id="equipe-search" class="equipe-search__input" placeholder="Rechercher un email…" autocomplete="off">
            </label>
        </div>

        <p class="equipe-status" id="equipe-status" aria-live="polite">Chargement…</p>
        <div class="equipe-grid" id="equipe-grid" hidden></div>
    </main>

    <script src="./equipe.js"></script>
</body>
</html>
