<!DOCTYPE html>
<!-- 02-menu/pages/fichiers/ — projets perso + projets collaboratifs. -->
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nolimi — Fichiers</title>
    <link rel="icon" href="../../../assets/brand/favicon-64.png" type="image/png" sizes="64x64">
    <link rel="icon" href="../../../assets/brand/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="../../../assets/brand/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="../../main.css">
    <link rel="stylesheet" href="./fichiers.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../01-saas/config/supabase.config.js"></script>
    <script src="../../../01-saas/lib/auth.js"></script>
    <script src="../../../01-saas/store/cloud-projects.js"></script>
</head>
<body class="page page--menu">
    <script src="../../components/sidebar/sidebar.js"></script>
    <script>NolimiMenuSidebar.mount({ current: 'fichiers' });</script>

    <main class="menu-main menu-main--fichiers">
        <div class="fichiers-toolbar">
            <button type="button" class="fichiers-btn fichiers-btn--secondary" id="btn-create-folder">
                <svg class="fichiers-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8A2.5 2.5 0 0 1 6 5.5h4l2 2h6A2.5 2.5 0 0 1 20.5 10v7A2.5 2.5 0 0 1 18 19.5H6A2.5 2.5 0 0 1 3.5 17V8Z"/><path d="M12 12v5M9.5 14.5h5"/></svg>
                Nouveau dossier
            </button>
            <button type="button" class="fichiers-btn fichiers-btn--primary" id="btn-new-project">
                <svg class="fichiers-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Nouveau projet
            </button>
            <button type="button" class="fichiers-btn fichiers-btn--primary" id="btn-new-collab-project" hidden>
                <svg class="fichiers-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Nouveau projet
            </button>
        </div>

        <section class="fichiers-section" data-collapsible>
            <header class="fichiers-section__header">
                <div class="fichiers-section__heading">
                    <button type="button" class="fichiers-panel__toggle" aria-expanded="true" aria-controls="fichiers-panel-body" aria-label="Replier la section">
                        <svg class="fichiers-panel__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <button type="button" class="fichiers-title-btn" id="fichiers-title-btn">
                        <h1 class="fichiers-title" id="fichiers-title">Mes projets</h1>
                    </button>
                    <nav id="fichiers-breadcrumb" class="fichiers-breadcrumb" aria-label="Emplacement" hidden></nav>
                </div>
            </header>

            <div id="fichiers-panel-body" class="fichiers-panel">
                <div class="fichiers-table-head" aria-hidden="true">
                    <span>Nom</span>
                    <span>Fichiers</span>
                    <span>Modifié le</span>
                </div>
                <p id="fichiers-status" class="fichiers-status" aria-live="polite">Chargement…</p>
                <ul id="fichiers-list" class="fichiers-list" hidden></ul>
            </div>
        </section>

        <section class="fichiers-section" data-collapsible>
            <header class="fichiers-section__header">
                <div class="fichiers-section__heading">
                    <button type="button" class="fichiers-panel__toggle" aria-expanded="true" aria-controls="collab-panel-body" aria-label="Replier la section">
                        <svg class="fichiers-panel__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                    <button type="button" class="fichiers-title-btn" id="collab-title-btn">
                        <h2 class="fichiers-title" id="collab-title">Projets collaboratifs</h2>
                    </button>
                    <nav id="collab-breadcrumb" class="fichiers-breadcrumb" aria-label="Projet collaboratif" hidden></nav>
                </div>
            </header>

            <div id="collab-panel-body" class="fichiers-panel">
                <div class="fichiers-table-head" aria-hidden="true">
                    <span>Nom</span>
                    <span>Fichiers</span>
                    <span>Modifié le</span>
                </div>
                <p id="collab-status" class="fichiers-status" aria-live="polite">Chargement…</p>
                <ul id="collab-list" class="fichiers-list" hidden></ul>
            </div>
        </section>
    </main>

    <div id="folder-modal" class="collab-modal" hidden>
        <div class="collab-modal__panel" role="dialog" aria-modal="true" aria-labelledby="folder-modal-title">
            <h2 id="folder-modal-title" class="collab-modal__title">Nouveau dossier</h2>

            <label class="collab-modal__label">
                <span>Nom</span>
                <input type="text" id="folder-modal-name" class="collab-modal__input" placeholder="Nom du dossier" maxlength="80">
            </label>

            <fieldset class="folder-modal__type">
                <legend class="folder-modal__legend">Où créer ce dossier ?</legend>
                <label class="folder-modal__radio">
                    <input type="radio" name="folder-type" value="personal" checked>
                    <span>Mes projets</span>
                </label>
                <label class="folder-modal__radio">
                    <input type="radio" name="folder-type" value="collab">
                    <span>Projets collaboratifs</span>
                </label>
            </fieldset>

            <div id="folder-modal-personal" class="folder-modal__section">
                <label class="collab-modal__label">
                    <span>Dans quel dossier ?</span>
                    <select id="folder-modal-parent" class="collab-modal__input collab-modal__select">
                        <option value="">À la racine</option>
                    </select>
                </label>
            </div>

            <div id="folder-modal-collab" class="folder-modal__section" hidden>
                <p class="collab-modal__lead">Avec qui partager ?</p>
                <div id="folder-modal-members" class="collab-modal__members"></div>
            </div>

            <p id="folder-modal-error" class="collab-modal__error" aria-live="polite"></p>
            <div class="collab-modal__actions">
                <button type="button" class="fichiers-btn fichiers-btn--secondary" id="folder-modal-cancel">Annuler</button>
                <button type="button" class="fichiers-btn fichiers-btn--primary" id="folder-modal-submit">Créer</button>
            </div>
        </div>
    </div>

    <script src="./fichiers.js"></script>
</body>
</html>
